name: Update activity heatmap

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_activity.py
      - name: Commit if changed
        run: |
          git config user.name "activity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/activity.json
          git diff --cached --quiet || (git commit -m "Update activity data" && git push)
